name: checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    # `github.workflow` is the caller's name: on a pull request ci.yml already runs these checks.
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test on ${{ matrix.os }}
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners default autocrlf to true, which rewrites the byte-compared golden files.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Show the git version
        run: git --version

      - name: Test
        run: cargo test --locked
