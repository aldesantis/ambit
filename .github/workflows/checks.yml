# The checks every commit has to pass: format, lint, and the test suite on Linux, macOS and Windows.
# Called by ci.yml on pull requests and pushes to `main`, and by release.yml (through `plan-jobs` in
# dist-workspace.toml) on the tagged commit before any binary is built.
#
# Three decisions worth knowing:
#
#   - The toolchain comes from rust-toolchain.toml. Every runner image ships rustup, which installs
#     the pinned version on first use, so a new stable release cannot turn this red on its own.
#   - The suite runs on all three platforms because the symlink, path and self-update code differs
#     per platform and each variant ships.
#   - `core.autocrlf` is turned off before checkout. Windows runners default it to true, which would
#     rewrite the golden files and fixtures the tests compare byte for byte.
#
# release.yml also runs on pull requests (only `dist plan` there), and ci.yml already runs these
# checks for the same pull request. `github.workflow` is the caller's name, so each job skips itself
# when the caller is the release workflow and the event is a pull request.
name: checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Separate from clippy because the failure means something different: clippy failing is a
      # defect to think about, fmt failing is `cargo fmt` and nothing else.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The FFI library links ambit-core without its `cli` feature, a build the step above never
      # makes.
      - name: Clippy without the CLI
        run: cargo clippy -p ambit-core --no-default-features --all-targets --locked -- -D warnings

  test:
    name: test on ${{ matrix.os }}
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # git is preinstalled on every hosted runner; the suite drives it for git catalog sources.
      - name: Show the git version
        run: git --version

      - name: Test
        run: cargo test --locked
