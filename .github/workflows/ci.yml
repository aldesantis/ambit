# Runs the checks in checks.yml on every pull request and every push to `main`. The release workflow
# runs the same file on the tagged commit, so what CI accepts and what a release requires cannot
# drift apart.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch makes the previous run's answer stale; on `main` runs are left alone so
# every commit on the default branch has a recorded verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  macos-app:
    uses: ./.github/workflows/macos-app.yml
