[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Archive names, formats and `.sha256` files must stay at dist's defaults: self-update downloads
# and verifies them by those names (src/self_update/platform.rs).
checksum = "sha256"
install-path = "~/.local/bin"
install-updater = false
pr-run-mode = "plan"
plan-jobs = ["./checks"]

# The build runner's glibc sets the oldest distro the Linux binaries run on.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
