[package]
name = "ambit"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "A deterministic dependency manager for AI-agent capabilities: skills, MCP servers and hooks, selected by name or tag."
repository = "https://github.com/aldesantis/ambit"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
ryu-js = "1.0.3"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json", "preserve_order"] }
saphyr = "0.1.0"
saphyr-parser = "0.1.0"
regex = "1.13.1"
sha2 = "0.11.0"
ureq = "3.4.2"
tar = "0.4.46"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
semver = "1.0.28"
url = "2.5.8"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help"] }
# Pinned: later versions need Rust 1.89, and the version decides the bytes ambit writes.
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["serialize"] }
gray_matter = { version = "0.3.2", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"

[profile.dist]
inherits = "release"
lto = "thin"

# dist skips `publish = false` packages unless this is set.
[package.metadata.dist]
dist = true
