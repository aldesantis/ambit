[package]
name = "ambit"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "A deterministic dependency manager for AI-agent capabilities: skills, MCP servers and hooks, selected by name or tag."
repository = "https://github.com/aldesantis/ambit"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
ryu-js = "1.0.3"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json", "preserve_order"] }
saphyr = "0.1.0"
# The event stream, for the checks saphyr's loader does not make; see model::yaml::load.
saphyr-parser = "0.1.0"
regex = "1.13.1"
sha2 = "0.11.0"
ureq = "3.4.2"
tar = "0.4.46"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz"] }
# Decompression only: the `deflate` feature would also pull in the zopfli compressor.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
semver = "1.0.28"
url = "2.5.8"
# No `color`: usage text goes through ambit's own output, uncolored, the same everywhere.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
# The self-update suites build cargo-dist-shaped `.tar.xz` archives to serve from a fake GitHub.
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# model::catalog::CatalogSkill mirrors the TS names porters search for.
module_name_repetitions = "allow"
# Would annotate most pure functions.
must_use_candidate = "allow"
# Faithful ports of long TS functions.
too_many_lines = "allow"
# Option structs mirror CLI flags.
struct_excessive_bools = "allow"
similar_names = "allow"

# The profile that dist builds release binaries with
[profile.dist]
inherits = "release"
lto = "thin"

# `publish = false` keeps ambit off crates.io, which dist reads as "do not release" unless told
# otherwise. Releases are built by dist; see dist-workspace.toml.
[package.metadata.dist]
dist = true
